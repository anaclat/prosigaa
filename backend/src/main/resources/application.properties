spring.application.name=prosigaa
# Banco persistente em arquivo para manter os dados entre reinicializações.
spring.datasource.url=jdbc:h2:file:./data/prosigaa;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
springdoc.swagger-ui.path=/swagger-ui.html
# Padrão: * (permite qualquer origem). Em produção, restrinja por domínio.
# app.cors.allowed-origin-patterns=https://app.seudominio.com,https://admin.seudominio.com
# Busca em lote de associações lazy para reduzir consultas N+1
spring.jpa.properties.hibernate.default_batch_fetch_size=50
