services:
  backend:
    build:
      context: ./backend
    container_name: prosigaa-backend
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    volumes:
      - ./backend/data:/app/data

  frontend:
    build:
      context: ./ProSigaa
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8080}
    container_name: prosigaa-frontend
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    depends_on:
      - backend
